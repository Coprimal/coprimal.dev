name: Deploy website

# Publishes the landing page to GitHub Pages (https://coprimal.dev/).
# Only index.html, styles.css, main.js, assets/ and tools.json are published.
# tools.json is generated from GitHub at deploy by scripts/tools-json.sh: each tool's latest version and dates.
# Requires Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The hourly run keeps the tool versions in tools.json current.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css main.js _site/
          cp -R assets _site/assets
          [ -f _site/index.html ] || { echo "::error::_site/index.html is missing"; exit 1; }

      - name: Fetch tool versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/tools-json.sh > _site/tools.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
